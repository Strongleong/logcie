name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # The .tspec suite is the real check. strum is POSIX-only, so this is
  # everywhere it can run.
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      # Built from source rather than pulled from a release, so this does not
      # depend on an asset existing for the runner's platform.
      - name: Build strum
        run: |
          git clone --depth 1 https://github.com/Strongleong/Strum strum
          cd strum
          cc build.c -o build
          ./build -c ${{ matrix.cc }}
          echo "$PWD/out" >> "$GITHUB_PATH"

      - name: Build examples
        run: |
          cc build.c -o build
          ./build -c ${{ matrix.cc }} -x ${{ matrix.cxx }}

      - name: Run tests
        run: ./build tests

  # strum cannot run here, so this only answers "does the header compile and do
  # the examples work". That is still the question Windows most often fails.
  windows:
    name: windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw, msvc]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.toolchain == 'msvc'

      - name: Compile the header (msvc)
        if: matrix.toolchain == 'msvc'
        shell: cmd
        run: cl /nologo /W4 /WX /DLOGCIE_IMPLEMENTATION /TC /I. /c logcie.h /Fo:header.obj

      - name: Build and run an example (msvc)
        if: matrix.toolchain == 'msvc'
        shell: cmd
        run: |
          cl /nologo /W4 /WX /TC /I. examples\01_simple\main.c /Fe:simple.exe
          simple.exe

      - name: Compile the header (mingw)
        if: matrix.toolchain == 'mingw'
        shell: bash
        run: gcc -std=c99 -Wall -Wextra -Werror -DLOGCIE_IMPLEMENTATION -I. -c -x c logcie.h -o header.o

      - name: Build and run an example (mingw)
        if: matrix.toolchain == 'mingw'
        shell: bash
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -I. examples/01_simple/main.c -o simple.exe
          ./simple.exe

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build strum
        run: |
          git clone --depth 1 https://github.com/Strongleong/Strum strum
          cd strum
          cc build.c -o build
          ./build -c gcc
          echo "$PWD/out" >> "$GITHUB_PATH"

      # -d turns on ASan for the examples; the suite has its own TSan case
      - name: Examples under AddressSanitizer
        run: |
          cc build.c -o build
          ./build -d -c gcc -x g++
          for exe in out/*; do [ -x "$exe" ] && [ -f "$exe" ] && "$exe" >/dev/null; done

      - name: Tests
        run: ./build tests
